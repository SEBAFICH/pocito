<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>POCITO</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #fff; }
    #app-frame { width: 100%; height: 100dvh; border: 0; display: block; background: #fff; }
    #loading {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #fff; color: #222; text-align: center; padding: 24px;
    }
    #loading[hidden] { display: none; }
    .loading-box { max-width: 520px; }
    .loading-box p { margin: 8px 0; }
    .fallback { font-size: 14px; }
    .fallback a { color: inherit; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-box">
      <p><strong>Cargando POCITO...</strong></p>
      <p class="fallback">Si no carga correctamente, <a id="direct-link" href="#" target="_blank" rel="noopener noreferrer">abrir la app directamente</a>.</p>
    </div>
  </div>

  <iframe
    id="app-frame"
    title="POCITO"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const APP_SCRIPT_URL = 'https://script.google.com/a/macros/grupoproaco.com/s/AKfycbzyzKcj1OlmSPydsvhws-NEPiqYSCBbNDZ_oYnWGWPvaExJivlC_6CIiTb32GyaLpPM/exec';
    const frame = document.getElementById('app-frame');
    const loading = document.getElementById('loading');
    const directLink = document.getElementById('direct-link');

    directLink.href = APP_SCRIPT_URL;

    // Evita reutilizar una copia cacheada del documento principal de Apps Script.
    const separator = APP_SCRIPT_URL.includes('?') ? '&' : '?';
    frame.src = `${APP_SCRIPT_URL}${separator}_vercel=${Date.now()}`;

    frame.addEventListener('load', () => {
      loading.hidden = true;
    });
  </script>
</body>
</html>
