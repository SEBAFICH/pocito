<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1524">
  <title>POCITO</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1524;
    }
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #0b1524;
    }
  </style>
</head>
<body>
  <iframe
    id="app-frame"
    title="POCITO"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const APP_SCRIPT_URL = 'https://script.google.com/a/macros/grupoproaco.com/s/AKfycbzyzKcj1OlmSPydsvhws-NEPiqYSCBbNDZ_oYnWGWPvaExJivlC_6CIiTb32GyaLpPM/exec';
    const separator = APP_SCRIPT_URL.includes('?') ? '&' : '?';
    document.getElementById('app-frame').src = `${APP_SCRIPT_URL}${separator}_vercel=${Date.now()}`;
  </script>
</body>
</html>
