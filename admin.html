<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>POCITO - Administración</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #fff; }
    #admin-frame { width: 100%; height: 100dvh; border: 0; display: block; background: #fff; }
    #loading {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #fff; color: #222; text-align: center; padding: 24px;
    }
    #loading[hidden] { display: none; }
    .loading-box { max-width: 560px; }
    .loading-box p { margin: 8px 0; }
    .fallback { font-size: 14px; line-height: 1.4; }
    .fallback a { color: inherit; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-box">
      <p><strong>Cargando administración...</strong></p>
      <p class="fallback">Si Google Workspace solicita autenticación o bloquea la vista embebida, <a id="direct-link" href="#" target="_blank" rel="noopener noreferrer">abrir el administrador directamente</a>.</p>
    </div>
  </div>

  <iframe
    id="admin-frame"
    title="POCITO - Administración"
    allow="fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const ADMIN_SCRIPT_URL = 'https://script.google.com/a/macros/grupoproaco.com/s/AKfycbzyzKcj1OlmSPydsvhws-NEPiqYSCBbNDZ_oYnWGWPvaExJivlC_6CIiTb32GyaLpPM/exec?page=admin';
    const frame = document.getElementById('admin-frame');
    const loading = document.getElementById('loading');
    const directLink = document.getElementById('direct-link');

    directLink.href = ADMIN_SCRIPT_URL;

    // Mantiene page=admin y agrega un valor variable para evitar cache del documento principal.
    frame.src = `${ADMIN_SCRIPT_URL}&_vercel=${Date.now()}`;

    frame.addEventListener('load', () => {
      loading.hidden = true;
    });
  </script>
</body>
</html>
